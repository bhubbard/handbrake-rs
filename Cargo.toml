[package]
name = "handbrake-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
description = "High-performance, memory-safe video transcoding engine and CLI inspired by HandBrake (libhb) in pure Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/bhubbard/handbrake-rs"
homepage = "http://code.brandonhubbard.com/handbrake-rs/"

[[bin]]
name = "HandBrakeCLI"
path = "src/bin/main.rs"

[lib]
name = "handbrake_rs"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
indicatif = "0.17"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.12"
