[package]
name = "handbrake-app"
version = "0.1.0"
description = "HandBrake in Pure Rust"
edition = "2021"

[lib]
name = "handbrake_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
handbrake-rs = { path = ".." }
tokio = { version = "1", features = ["full"] }
